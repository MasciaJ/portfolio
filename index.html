<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascia Web | Portafolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Mascia Web</a>
            <div class="d-flex gap-3">
                <a href="#sobre-mi" class="nav-link text-white">Sobre mí</a>
                <a href="#proyectos" class="nav-link text-white">Proyectos</a>
                <a href="#contacto" class="nav-link text-white">Contacto</a>
            </div>
        </div>
    </header>

    <main class="container my-3">
        <section id="sobre-mi" class="mb-3">
            <div class="p-5 bg-light border rounded-3 shadow-sm" style="min-height: 400px;">
                <h1 class="display-5 fw-bold">Sobre mi</h1>
                <p class="lead">Bienvenido a mi portafolio web, aqui encontrarás mi informacion</p>
            </div>
        </section>


        <section id="proyectos" class="mb-3">
            <div class="p-5 bg-light border rounded-3 shadow-sm" style="min-height: 400px;">
                <h2 class="display-5 fw-bold">Proyectos</h2>
                <p class="lead">Aquí se mostrarán los trabajos y desarrollos en los que he participado</p>
                
                <div class="row">
                    <article class="col-md-4 mb-3 project-card">
                        <div class="d-grid gap-2">
                            <img src="html/imagenes/mariano.jpg" alt="Mariano bros" class="img-fluid rounded">
                        </div>
                    </article>

                    <article class="col-md-4 mb-3 project-card">
                        <div class="d-grid gap-2">
                            <img src="html/imagenes/spotify.png" alt="Spotify" class="img-fluid rounded">
                        </div>
                    </article>

                    <article class="col-md-4 mb-3 project-card">
                        <div class="d-grid gap-2">
                            <img src="html/imagenes/pokedex.png" alt="Pokedex" class="img-fluid rounded">
                        </div>
                    </article>
                </div>
            </div>
        </section>

        <section id="contacto" class="mb-3">
            <div class="p-5 bg-light border rounded-3 shadow-sm" style="min-height: 400px;">
                <h2 class="display-5 fw-bold">Contacto</h2>
                <p class="lead">Ponte en contacto conmigo</p>
            </div>
        </section>
    </main>


    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 Mascia Web - Todos los derechos reservados.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
